<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YouTube</title>
<style>body{margin:0;font-family:system-ui,sans-serif}</style>
</head>
<body>
<!-- Hand-written minimal skeleton. Real scrubbed captures arrive in Phase 1. -->
<ytd-app>
  <div id="content">
    <ytd-rich-grid-renderer>
      <div id="contents">
        <ytd-rich-item-renderer><a href="/watch?v=aaaaaaaaaaa">Video one</a></ytd-rich-item-renderer>
        <ytd-rich-item-renderer><a href="/watch?v=bbbbbbbbbbb">Video two</a></ytd-rich-item-renderer>
      </div>
    </ytd-rich-grid-renderer>
  </div>
</ytd-app>
</body>
</html>
